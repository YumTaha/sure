name: CI

on:
  workflow_call:
    inputs:
      require_js_dependency_audit:
        description: "Fail the workflow when the importmap JavaScript dependency audit cannot complete"
        required: false
        type: boolean
        default: false

jobs:
  # The pinned ruby/setup-ruby action does not support Ubuntu 26.04.
  scan_ruby:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in Ruby dependencies
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        continue-on-error: ${{ !inputs.require_js_dependency_audit }}
        env:
          REQUIRE_JS_DEPENDENCY_AUDIT: ${{ inputs.require_js_dependency_audit }}
        run: |
          attempts=3
          if [ "$REQUIRE_JS_DEPENDENCY_AUDIT" != "true" ]; then
            attempts=1
          fi

          for attempt in $(seq 1 "$attempts"); do
            echo "Running importmap audit, attempt ${attempt}/${attempts}"
            bin/importmap audit && exit 0

            if [ "$attempt" = "$attempts" ]; then
              exit 1
            fi

            sleep $((attempt * 10))
          done

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  lint_js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install
        shell: bash

      - name: Lint/Format js code
        run: npm run lint

  # Fork: ONE shard, not upstream's two. Sharding trades total runner time for
  # wall-clock, because every shard repeats bundle install, the database setup
  # and the asset build. Measured on this repo: 44.7 runner-minutes sharded
  # (2 unit + 3 system) against 28.7 unsharded, a 56% increase for the same
  # tests. GitHub automatically disables workflows on a FORK that uses a
  # significant amount of GitHub-hosted runner time, and it has already done
  # that here twice (2026-10-14 and 2026-11-12; GitHub Support ticket
  # 5024902), with about half the fork's runner time coming from this workflow
  # on the weekly upstream-sync pull requests. Wall-clock does not matter for
  # an unattended sync; staying enabled does. Keep this at one shard and keep
  # the timeout below, which upstream's sharding removed the need for.
  test_unit_shard:
    name: test_unit (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    # Unsharded unit runs measured 9.9 min and the suite keeps growing.
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        shard: [ 1 ]

    env:
      PLAID_CLIENT_ID: foo
      PLAID_SECRET: bar
      DATABASE_URL: postgres://postgres:postgres@localhost:5432 # pipelock:ignore
      REDIS_URL: redis://localhost:6379
      RAILS_ENV: test

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install packages
        run: |
          set -euo pipefail
          # The runner image ships a Google Chrome apt source that intermittently
          # serves a stale index ("Hash Sum mismatch"), which fails `apt-get
          # update` for packages that have nothing to do with Chrome. Retry with
          # a cleared list cache, then without that source. This job never needs
          # Chrome, so dropping the source is always safe here.
          sudo apt-get update -o Acquire::Retries=3 \
            || { sudo rm -rf /var/lib/apt/lists/*; sudo apt-get update -o Acquire::Retries=3; } \
            || { sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
                 sudo rm -rf /var/lib/apt/lists/*
                 sudo apt-get update -o Acquire::Retries=3; }
          sudo apt-get install --no-install-recommends -y curl libvips postgresql-client libpq-dev

      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: DB setup and smoke test
        run: |
          bin/rails db:create
          bin/rails db:schema:load
          bin/rails db:seed

      - name: Unit and integration tests
        env:
          SHARD: ${{ strategy.job-index }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          # Same files as a plain `bin/rails test`, which leaves out system,
          # dummy and fixtures tests.
          mapfile -t all < <(find test -name '*_test.rb' -not -path 'test/system/*' -not -path 'test/dummy/*' -not -path 'test/fixtures/*' | LC_ALL=C sort)
          # Fail when nothing is found at all: without file arguments,
          # `bin/rails test` would quietly run the whole suite instead.
          if [ "${#all[@]}" -eq 0 ]; then
            echo "No unit test files found" >&2
            exit 1
          fi
          mapfile -t files < <(printf '%s\n' "${all[@]}" | awk -v n="$SHARDS" -v i="$SHARD" '(NR - 1) % n == i')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::Unit test shard $((SHARD + 1))/${SHARDS} has no files (${#all[@]} in total)"
            exit 0
          fi
          echo "${#files[@]} test files in shard $((SHARD + 1))/${SHARDS}"
          # Running test files directly skips test:prepare (Tailwind build).
          bin/rails test:prepare
          bin/rails test "${files[@]}"

      # Encryption tests skip unless Active Record encryption is configured
      # through ENV or credentials (Encryptable.encryption_ready?), so the run
      # above never exercises them. Rerun every test file that checks
      # encryption_ready? with throwaway keys, so new encryption tests are
      # picked up without a hand-kept list. The whole suite is not run with
      # keys because unrelated tests assume encryption is off. Only the first
      # shard runs them.
      - name: Encryption tests
        if: ${{ !cancelled() && strategy.job-index == 0 }}
        env:
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: test
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: test
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: test
        run: |
          mapfile -t files < <(grep -rl --include='*_test.rb' 'encryption_ready?' test | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No encryption tests found" >&2
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          bin/rails test "${files[@]}"

  # Keeps a single "test_unit" check for branch protection and reviewers.
  test_unit:
    if: ${{ always() }}
    needs: test_unit_shard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check unit test shards
        env:
          RESULT: ${{ needs.test_unit_shard.result }}
        run: |
          echo "Unit test shards: ${RESULT}"
          [ "$RESULT" = "success" ]

  # The rswag specs generate docs/api/openapi.yaml. Running them checks that
  # every documented request still gets the documented response.
  test_api_docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      PLAID_CLIENT_ID: foo
      PLAID_SECRET: bar
      DATABASE_URL: postgres://postgres:postgres@localhost:5432 # pipelock:ignore
      REDIS_URL: redis://localhost:6379
      RAILS_ENV: test

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install packages
        run: |
          set -euo pipefail
          # Same stale Google Chrome apt-source retry as the unit job; this job
          # never needs Chrome, so dropping that source is always safe here.
          sudo apt-get update -o Acquire::Retries=3 \
            || { sudo rm -rf /var/lib/apt/lists/*; sudo apt-get update -o Acquire::Retries=3; } \
            || { sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
                 sudo rm -rf /var/lib/apt/lists/*
                 sudo apt-get update -o Acquire::Retries=3; }
          sudo apt-get install --no-install-recommends -y curl libvips postgresql-client libpq-dev

      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: DB setup
        run: |
          bin/rails db:create
          bin/rails db:schema:load

      - name: API documentation specs
        run: bundle exec rspec

  # System tests run serially (they flake when parallel workers compete for
  # the runner's CPUs). Fork: ONE shard, not upstream's three -- see the unit
  # job above for why total runner time matters more than wall-clock here.
  test_system_shard:
    name: test_system (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    # Unsharded system runs measured 12.4 min; headroom for a serial suite.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shard: [ 1 ]

    env:
      PLAID_CLIENT_ID: foo
      PLAID_SECRET: bar
      DATABASE_URL: postgres://postgres:postgres@localhost:5432 # pipelock:ignore
      REDIS_URL: redis://localhost:6379
      RAILS_ENV: test

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install packages
        run: |
          set -euo pipefail
          # See the unit job for why `apt-get update` is retried: the runner's
          # Google Chrome apt source intermittently serves a stale index. This
          # job does need Chrome, so the source is only dropped as a last resort
          # and we then fall back to the Chrome preinstalled on the image.
          sudo apt-get update -o Acquire::Retries=3 \
            || { sudo rm -rf /var/lib/apt/lists/*; sudo apt-get update -o Acquire::Retries=3; } \
            || { sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
                 sudo rm -rf /var/lib/apt/lists/*
                 sudo apt-get update -o Acquire::Retries=3; }
          sudo apt-get install --no-install-recommends -y curl libvips postgresql-client libpq-dev
          sudo apt-get install --no-install-recommends -y google-chrome-stable \
            || command -v google-chrome >/dev/null \
            || { echo "::error::No Chrome available for system tests"; exit 1; }
          # The runner image ships a chromedriver that lags google-chrome-stable.
          # Drop it so Selenium Manager resolves a driver matching the Chrome in
          # use, instead of the stale one in PATH.
          sudo rm -f /usr/bin/chromedriver

      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: DB setup and smoke test
        run: |
          bin/rails db:create
          bin/rails db:schema:load
          bin/rails db:seed

      - name: System tests
        env:
          SHARD: ${{ strategy.job-index }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          mapfile -t all < <(find test/system -name '*_test.rb' | LC_ALL=C sort)
          # Fail when nothing is found at all, so a moved folder can't pass
          # with zero system tests.
          if [ "${#all[@]}" -eq 0 ]; then
            echo "No system test files found" >&2
            exit 1
          fi
          mapfile -t files < <(printf '%s\n' "${all[@]}" | awk -v n="$SHARDS" -v i="$SHARD" '(NR - 1) % n == i')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::System test shard $((SHARD + 1))/${SHARDS} has no files (${#all[@]} in total)"
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          # Unlike test:system, running test files directly skips test:prepare,
          # which builds the Tailwind CSS the pages need.
          bin/rails test:prepare
          DISABLE_PARALLELIZATION=true bin/rails test "${files[@]}"

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: screenshots-${{ matrix.shard }}
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Keeps a single "test_system" check for branch protection and reviewers.
  test_system:
    if: ${{ always() }}
    needs: test_system_shard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check system test shards
        env:
          RESULT: ${{ needs.test_system_shard.result }}
        run: |
          echo "System test shards: ${RESULT}"
          [ "$RESULT" = "success" ]
